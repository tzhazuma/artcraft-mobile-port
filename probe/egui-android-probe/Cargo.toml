[package]
name = "egui-android-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "main"
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "android-game-activity",
] }
winit = { version = "0.30", default-features = false }
log = "0.4"
android_logger = "0.15"
